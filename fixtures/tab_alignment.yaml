title: Of One that is so Fair and Bright
composer: Anonymous
composer_dates: 15th century
text:
  stanzas:
    - lines:
        - "Of one who is so fair and bright"
        - "  _Velut maris stella,_\t[Like a star of the sea]"
        - "Brighter than the day is light,"
        - "  _Parens et puella:_\t[Both mother and maiden]"
        - "I cry to thee, thou see to me,"
        - "Lady, pray thy Son for me,"
        - "  _Tam pia,_\t[so pure]"
        - "That I may come to thee."
        - "  _Maria!_\t[Mary]"
